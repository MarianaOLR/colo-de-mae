<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colo de Mãe | Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <svg
          width="27"
          height="38"
          viewBox="0 0 41.5 56"
          fill="none"
          stroke="#5A3E3E"
          stroke-width="2.1"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="margin-right: 11px"
        >
          <circle cx="12.1" cy="10" r="7.6" />
          <circle cx="28.5" cy="10" r="7.6" />
          <circle cx="12.1" cy="26.2" r="7.6" />
          <circle cx="28.5" cy="26.2" r="7.6" />
          <circle cx="20.3" cy="17.6" r="4.6" fill="#FFF8F0" />
          <path d="M20.3 31V53.5" />
          <path d="M1.3 40.3C2 48 10 54 20.3 53.7C18 46 10 41 1.3 40.3Z" />
          <path
            d="M39.3 40.3C38.6 48 30.6 54 20.3 53.7C22.6 46 30.6 41 39.3 40.3Z"
          />
        </svg>
        Colo de Mãe
      </div>
      <nav>
        <a href="index.html">← Voltar para Home</a>
      </nav>
    </header>

    <div class="cadastro">
      <div class="form-card">
        <h1>Entrar</h1>
        <p class="form-sub">Que bom te ver de volta.</p>

        <label>Email</label>
        <input id="ipt_email" type="text" placeholder="seuemail@exemplo.com" />

        <label>Senha</label>
        <input id="ipt_senha" type="password" placeholder="Sua senha" />

        <div id="div_mensagem"></div>

        <button type="button" class="botao botao-largo" onclick="entrar()">
          Entrar
        </button>

        <p class="form-rodape">
          Ainda não tenho conta · <a href="cadastro.html"><b>Cadastrar</b></a>
        </p>
      </div>
    </div>

    <footer>
      <span>Projeto Individual · SPTech · 1ADSA</span>
      <i>Feito de afeto, para guardar afeto.</i>
    </footer>
  </body>
</html>

<script>
  function entrar() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    let campos = [email, senha];
    let rotulos = ["Email", "Senha"];

    let mensagem = "";
    let qtdErros = 0;

    for (let i = 0; i < campos.length; i++) {
      if (campos[i] == "") {
        mensagem += `• Preencha o campo "${rotulos[i]}".<br>`;
        qtdErros++;
      }
    }

    let criteriosEmail =
      Number(email.includes("@")) + Number(email.includes("."));

    if (email != "" && criteriosEmail < 2) {
      mensagem += "• O email precisa ter @ e ponto (ex.: nome@email.com).<br>";
      qtdErros++;
    }

    if (qtdErros == 0) {
      div_mensagem.innerHTML = `<span style="color: green;">Entrando...</span>`;

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha,
        }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            resposta.json().then(function (json) {
              sessionStorage.ID_USUARIO = json.id;
              sessionStorage.NOME_USUARIO = json.nome;
              sessionStorage.EMAIL_USUARIO = json.email;

              div_mensagem.innerHTML = `<span style="color: green;">Bem-vinda, ${json.nome}!</span>`;
            });
          } else {
            div_mensagem.innerHTML = `<span style="color: red;">Email e/ou senha inválido(s).</span>`;
          }
        })
        .catch(function (erro) {
          console.log(erro);
          div_mensagem.innerHTML = `<span style="color: red;">Erro de conexão com o servidor.</span>`;
        });
    } else {
      div_mensagem.innerHTML = `<span style="color: red;">${mensagem}</span>`;
    }
  }
</script>
